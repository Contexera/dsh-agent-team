version: 2
updates:
  # The pnpm lockfile is the install authority for every package in this repo.
  # `@deepseek-ai/*` is excluded on purpose: the DSH range is a certified
  # contract (docs/dsh-release-compatibility.md), moved only by a certification
  # round — never by an automated bump.
  # Three at a time, not five. A batch here is reviewed as "run the suite, merge
  # if green" — every PR touches only the manifest and the lockfile, and the last
  # batch moved vitest 4 to 5 with the suite unchanged — so an extra round costs
  # one test run, while a long queue costs skipped review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@deepseek-ai/*"

  # Workflows pin third-party actions to commit SHAs, so a new version only
  # arrives as an explicit dependency bump here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
