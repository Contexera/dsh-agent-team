version: 2
updates:
  # npm is deliberately absent. Half the PRs it opened here were withdrawn: four
  # duplicated a manifest bump made by hand in the same week, two targeted
  # dependencies that had already been deleted, and two could never merge -- our
  # `zod` must resolve to the version the certified Harness resolves (a minor gap
  # breaks Typert analysis), and the client renders inside the Harness's React 18.
  # Repository security alerts cover the advisories this would have surfaced.
  #
  # Workflows pin third-party actions to commit SHAs, so a new version only
  # arrives as an explicit dependency bump here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
